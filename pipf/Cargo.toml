[package]
name = "pipf"
version = "0.1.0"
edition = "2021"

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["serde", "alloc", "digest", "rand_core"] }
rand = { version = "0.8", features = ["std"] }
merlin = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
byte-tools = "0.3.1"
bulletproofs = "4.0"
